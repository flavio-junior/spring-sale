aws:
  access_key_id: ${AWS_ACCESS_KEY_SPRING_SALE:empty}
  secret_access_key: ${AWS_SECRET_KEY_SPRING_SALE:empty}
email:
  password-recover:
    token:
      minutes: ${PASSWORD_RECOVER_TOKEN_MINUTES:5}
    uri: ${PASSWORD_RECOVER_URI:http://localhost:5173/recover-password/}
security:
  jwt:
    token:
      secret-key: 53cr37
      expires-at: ${EXPIRE_TOKEN_TIME:7}
spring:
  application:
    name: Spring Sale
  mail:
    host: ${EMAIL_HOST_SPRING_SALE:smtp.gmail.com}
    port: ${EMAIL_PORT_SPRING_SALE:587}
    username: ${ACCOUNT_USERNAME_SPRING_SALE_TEST}
    password: ${ACCOUNT_PASSWORD_SPRING_SALE_TEST}
    properties:
      mail:
        debug: false
        smtp:
          auth: true
          starttls:
            enable: true
  jackson:
    time-zone: ${TIME_ZONE}
  profiles:
    active: ${APP_PROFILE:test}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:200MB}
      max-request-size: ${MAX_FILE_SIZE:200MB}
